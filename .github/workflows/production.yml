name: Production CI/CD Auto-Deploy

on:
  push:
    branches:
      - prod

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Auto-Deploy to Hostinger Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true

          script: |
            set -e

            APP_DIR="/var/www/hms.haripushphostel.in"

            echo "=========================================="
            echo "🚀 Starting Production Deployment"
            echo "=========================================="

            # ------------------------------------------
            # Update source code
            # ------------------------------------------

            echo "📥 Fetching latest prod branch...."

            cd "$APP_DIR"

            git fetch origin prod
            git checkout prod
            git reset --hard origin/prod

            echo "✅ Source code updated"

            # ------------------------------------------
            # Backend Deployment
            # ------------------------------------------

            echo "📦 Deploying Backend..."

            cd "$APP_DIR/backend"

            echo "📦 Installing backend dependencies..."
            npm ci --omit=dev

            echo "🔧 Generating Prisma Client..."
            npx prisma generate

            echo "🗄️ Running production database migrations..."
            npx prisma migrate deploy

            echo "🔄 Restarting backend with PM2..."

            cd "$APP_DIR"

            pm2 reload deploy/ecosystem.config.js \
              --env production \
              --update-env \
              || pm2 start deploy/ecosystem.config.js \
              --env production

            pm2 save

            echo "✅ Backend deployed"

            # ------------------------------------------
            # Frontend Deployment
            # ------------------------------------------

            echo "🌐 Deploying Frontend..."

            cd "$APP_DIR/frontend"

            echo "📦 Installing frontend dependencies..."
            npm ci

            echo "🏗️ Building frontend..."

            VITE_API_URL="https://hms-api.haripushphostel.in/api/v1" npm run build

            echo "📂 Publishing frontend..."

            rm -rf "$APP_DIR/html/"*
            cp -a "$APP_DIR/frontend/dist/." "$APP_DIR/html/"

            echo "✅ Frontend deployedd"

            # ------------------------------------------
            # Nginx
            # ------------------------------------------

            echo "🔍 Testing Nginx configuration..."

            sudo nginx -t 2>/dev/null || true

            echo "🔄 Reloading Nginx..."

            sudo systemctl reload nginx 2>/dev/null || true

            # ------------------------------------------
            # Final verification
            # ------------------------------------------

            echo "=========================================="
            echo "📊 PM2 Status"
            echo "=========================================="

            pm2 status

            echo "=========================================="
            echo "✅ PRODUCTION DEPLOYMENT COMPLETE"
            echo "=========================================="