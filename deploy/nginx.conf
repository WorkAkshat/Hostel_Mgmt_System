# ════════════════════════════════════════════════════════════════════════════
#  Hari Pushp PG Hostel Management System — Production Nginx Configuration
#  Domains:
#   - Frontend Web App: hms.haripushphostel.in
#   - Backend API:     hms-api.haripushphostel.in / www.hms-api.haripushphostel.in
# ════════════════════════════════════════════════════════════════════════════

# Rate Limiting Zone (10 requests/sec per IP for API)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ─── 1. Backend API (hms-api.haripushphostel.in & www) ──────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hms-api.haripushphostel.in www.hms-api.haripushphostel.in;

    # Redirect HTTP to HTTPS (uncomment when Let's Encrypt SSL is installed)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

